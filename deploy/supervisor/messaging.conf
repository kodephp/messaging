# =====================================================================
# kode/messaging supervisor 配置
# ---------------------------------------------------------------------
# 安装：
#   sudo cp deploy/supervisor/messaging.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start messaging:*
# =====================================================================

[group:messaging]
programs=ws,sse,mqtt,nats,grpc
priority=999
numprocs=1

# ---------- WebSocket ----------
[program:messaging-ws]
command=/usr/bin/php /srv/messaging/bin/messaging start --protocol=ws --port=8080
directory=/srv/messaging
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/log/messaging/ws.out.log
stderr_logfile=/var/log/messaging/ws.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=APP_ENV=production,MESSAGING_TRANSPORT=auto

# ---------- SSE ----------
[program:messaging-sse]
command=/usr/bin/php /srv/messaging/bin/messaging start --protocol=sse --port=8081
directory=/srv/messaging
user=www-data
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/log/messaging/sse.out.log
stderr_logfile=/var/log/messaging/sse.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

# ---------- MQTT 客户端（订阅外部 broker）----------
[program:messaging-mqtt]
command=/usr/bin/php /srv/messaging/bin/messaging start /srv/messaging/examples/mqtt_subscribe.php
directory=/srv/messaging
user=www-data
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stdout_logfile=/var/log/messaging/mqtt.out.log
stderr_logfile=/var/log/messaging/mqtt.err.log
environment=MQTT_BROKER_HOST=127.0.0.1,MQTT_BROKER_PORT=1883

# ---------- NATS 客户端 ----------
[program:messaging-nats]
command=/usr/bin/php /srv/messaging/bin/messaging start /srv/messaging/examples/nats_client.php
directory=/srv/messaging
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/messaging/nats.out.log
stderr_logfile=/var/log/messaging/nats.err.log

# ---------- gRPC ----------
[program:messaging-grpc]
command=/usr/bin/php /srv/messaging/bin/messaging start /srv/messaging/examples/grpc_server.php
directory=/srv/messaging
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/messaging/grpc.out.log
stderr_logfile=/var/log/messaging/grpc.err.log
