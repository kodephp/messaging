# =====================================================================
# kode/messaging Nginx 反向代理示例
# ---------------------------------------------------------------------
# 适用：浏览器只能访问 80/443 时，由 Nginx 转发到内网 messaging 服务
# 覆盖：WebSocket 升级、SSE keep-alive、Long-Polling、gRPC-Web
# =====================================================================

upstream messaging_ws {
    # 多 Worker 场景下使用 ip_hash 让同一客户端落到同一节点
    ip_hash;
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream messaging_sse {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream messaging_lp {
    server 127.0.0.1:8083;
    keepalive 32;
}

# -------------------- WebSocket --------------------
server {
    listen 80;
    listen [::]:80;
    server_name ws.example.com;

    # HTTP → HTTPS 强制跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ws.example.com;

    ssl_certificate     /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://messaging_ws;

        # WebSocket 升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接
        proxy_read_timeout  3600s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # 禁用缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# -------------------- SSE --------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sse.example.com;

    ssl_certificate     /etc/letsencrypt/live/sse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sse.example.com/privkey.pem;

    # SSE 不支持缓存
    location / {
        proxy_pass http://messaging_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        # 关键：SSE 保持长连接且不超时
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}

# -------------------- Long-Polling --------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lp.example.com;

    ssl_certificate     /etc/letsencrypt/live/lp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp.example.com/privkey.pem;

    location / {
        proxy_pass http://messaging_lp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 与 messaging.longpolling.hold_timeout_ms 保持一致
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
